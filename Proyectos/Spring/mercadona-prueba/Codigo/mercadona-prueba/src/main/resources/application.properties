# Configuracion de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:mercadonadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le decimos a Spring que cree las tablas primero y luego ejecute el data.sql
spring.jpa.defer-datasource-initialization=true

# Activamos la consola web de H2 para poder ver nuestras tablas visualmente
# 'http://localhost:8081/h2-console' con 'jdbc:h2:mem:mercadonadb' 

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cambiamos al puerto 8081 porque lo de doker se come el 8080
server.port=8081