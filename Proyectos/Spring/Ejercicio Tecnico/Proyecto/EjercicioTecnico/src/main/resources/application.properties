# Nombre de la aplicación
spring.application.name=EjercicioTecnico

# Configuración de base de datos mediante H2
spring.datasource.url=jdbc:h2:mem:vbotedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Habilitar la consola de H2 para ver los datos en el navegador 
# http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Esto crea las tablas automáticamente basadas en tus Entidades Java
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# Ejecutar data.sql DESPUÉS de crear las tablas (Para que Spring no intente ejecutar el archivo SQL antes de crear las tablas)
spring.jpa.defer-datasource-initialization=true